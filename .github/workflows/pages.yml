name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valori pubblici per design (la anon key è protetta dalle regole RLS)
      VITE_SUPABASE_URL: https://htdtwimhfooiuikcxxmd.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0ZHR3aW1oZm9vaXVpa2N4eG1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MDA0NjYsImV4cCI6MjEwOTM3NjQ2Nn0.iSoXqtuR8IRe9dcBqEmLSc4ovOqL_eR4RZwDbBlSR4Q
      VITE_PUBLIC_BASE_URL: https://lamastrossss.github.io/Segnalazioni/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
